<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Every effect here is SVG 1.1 filter work that QtSvg (SVG Tiny 1.2) drops:
       turbulence paper grain, specular lighting, a soft drop shadow and a blurred glow. -->
  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="4" result="noise"/>
      <feColorMatrix in="noise" type="matrix"
        values="0 0 0 0 0.35  0 0 0 0 0.22  0 0 0 0 0.05  0 0 0 0.55 0" result="grain"/>
      <feComposite in="grain" in2="SourceGraphic" operator="in" result="grainIn"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="grainIn"/></feMerge>
    </filter>
    <filter id="shine" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b"/>
      <feSpecularLighting in="b" surfaceScale="4" specularConstant="1.1" specularExponent="22"
        lighting-color="#fff" result="spec">
        <fePointLight x="30" y="10" z="90"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn"/>
      <feComposite in="SourceGraphic" in2="specIn" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.75"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <circle cx="64" cy="64" r="22" fill="#00e5ff" filter="url(#glow)"/>
  <g filter="url(#shadow)">
    <path d="M14 34 h36 l8 8 h56 v62 h-100 z" fill="#c8862a" filter="url(#paper)"/>
    <rect x="14" y="50" width="100" height="54" rx="4" fill="#e9a640" filter="url(#shine)"/>
  </g>
</svg>
